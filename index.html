<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM · NegoTrip</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#E8EAF1; --ink:#1B1F3A; --ink-2:#565B7A; --line:#D9DCE6;
  --accent:#A8321E; --accent-ink:#FFFFFF; --gold:#C98A12; --ok:#2F7D6B; --warn:#B7791F; --danger:#B3261E; --scrim:rgba(16,18,42,.45);
  --shadow:0 1px 2px rgba(27,31,58,.06),0 4px 14px rgba(27,31,58,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10122A; --surface:#1A1D3A; --surface-2:#23274A; --ink:#ECEDF7; --ink-2:#A3A7C6; --line:#2E3358;
    --accent:#E0654E; --accent-ink:#10122A; --gold:#E9B24A; --ok:#4DB39A; --warn:#E9B24A; --danger:#F08070; --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10122A; --surface:#1A1D3A; --surface-2:#23274A; --ink:#ECEDF7; --ink-2:#A3A7C6; --line:#2E3358;
  --accent:#E0654E; --accent-ink:#10122A; --gold:#E9B24A; --ok:#4DB39A; --warn:#E9B24A; --danger:#F08070; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:#1B1F3A;display:grid;place-items:center;flex:none}
.mark svg{width:28px;height:28px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1;margin:2px 0 0;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.me a{font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px}

.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-weight:600;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--mono);font-size:10.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:1px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cardhead h2{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;cursor:pointer;width:100%;display:block}
.tile .lab{font-size:12.5px;color:var(--ink-2);font-weight:600}
.tile .val{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-top:4px}
.tile.alert .val{color:var(--danger)}

.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stage{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.stage b{font-variant-numeric:tabular-nums}

.field{margin-bottom:12px;min-width:0}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:12px;color:var(--ink-2);margin-top:4px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=datetime-local],input[type=number],input[type=search],select,textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;padding:10px 12px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=datetime-local],input[type=number],input[type=search],select{height:44px;padding-block:0}
textarea{min-height:74px;resize:vertical;line-height:1.4}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.btn{height:44px;padding:0 18px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
.link.quiet{color:var(--ink-2)}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 220px;min-width:0}
.bar select{width:auto;min-width:150px;flex:1 1 150px;max-width:220px}
@media (max-width:520px){.bar select{max-width:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;display:inline-block}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{font-size:12px;text-align:left;color:var(--ink-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub,.sub{font-size:12.5px;color:var(--ink-2)}
.sub.over{color:var(--danger);font-weight:600}
td .no,.no{font-family:var(--mono);font-size:11.5px}
td a.name{font-weight:700;text-decoration:none}
td a.name:hover{text-decoration:underline}
@media (max-width:700px){
  .tablewrap{overflow:visible;margin:0;padding:0}
  table{min-width:0}
  thead{display:none}
  tr{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
  td{display:block;border:0;padding:2px 0}
  td:empty{display:none}
}

.back{display:inline-block;margin-bottom:10px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-decoration:none}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head .title{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.5vw,28px);line-height:1.1;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.head .pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 16px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--ink-2);font-weight:600}
.kv dd{margin:1px 0 0;overflow-wrap:anywhere}
.quote{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.next{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.ctl{grid-template-columns:1fr}}

ul.list{list-style:none;margin:0;padding:0}
ul.list > li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.list > li:last-child{border-bottom:0;padding-bottom:0}
ul.list > li:first-child{padding-top:0}
.task{display:flex;gap:10px;align-items:flex-start}
.task .tbody{flex:1;min-width:0}
.task .ttitle{font-weight:600;overflow-wrap:anywhere}
.task.done .ttitle{text-decoration:line-through;color:var(--ink-2);font-weight:500}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;flex:none;display:grid;place-items:center;font-size:14px;line-height:1;color:var(--ok);margin-top:1px;padding:0}
.tick:hover{border-color:var(--ok)}
.tl{position:relative;padding-left:18px!important}
.tl::before{content:"";position:absolute;left:3px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--line)}
ul.list > li.tl:first-child::before{top:7px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.rowbtw{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.factor{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:13.5px}
.factor b{font-variant-numeric:tabular-nums}
.scorebig{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}

.empty{text-align:center;padding:30px 18px}
.gate{min-height:70vh;display:grid;place-items:center}
.gate .card{max-width:440px;text-align:center;padding:28px 22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.err{color:var(--danger);font-size:13.5px;margin:0 0 10px}

dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,calc(100% - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:var(--scrim)}
.sheet{padding:20px}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#E9B24A" stroke-width="2.4"/><circle cx="16" cy="16" r="4.2" fill="#E0654E"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5" stroke="#E9B24A" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      <div><div class="eyebrow">NegoTrip HQ</div><h1>CRM</h1></div>
    </div>
    <div class="me" id="me"></div>
  </header>
  <main id="app"><div class="gate"><p class="muted">Loading…</p></div></main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="sheet" id="dlgForm" novalidate>
    <h2 id="dlgTitle"></h2>
    <p class="muted" id="dlgIntro" hidden></p>
    <p class="err" id="dlgErr" role="alert" hidden></p>
    <div class="fgrid" id="dlgFields"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="dlgCancel">Cancel</button>
      <button type="submit" class="btn" id="dlgSave">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------- config
const SUPABASE_URL = "https://wbynfjiaxpcoxthfuusk.supabase.co";
const SUPABASE_KEY = "sb_publishable_9LY7RvJpP7wY8rxp8edMmQ_eT-FcbuC"; // public browser key (same as NegoTrip HQ)
const API = "https://n8n.assignover.in/webhook/travelcrm-api";
const HQ_URL = new URL("../negotrip-hq/", location.href).href;

const STATUS = {
  new:"New", contacted:"Contacted", qualified:"Qualified", requirement_collected:"Requirement taken",
  quoted:"Quoted", negotiating:"Negotiating", won:"Won", lost:"Lost", dormant:"Dormant", duplicate:"Duplicate"
};
const STATUS_TONE = { new:"acc", won:"ok", lost:"bad", negotiating:"warn", quoted:"warn" };
const TEMP = { hot:["Hot","bad"], warm:["Warm","warn"], cold:["Cold",""] };
const ROLE = {
  super_admin:"Owner", company_admin:"Company admin", branch_manager:"Branch manager", sales_manager:"Sales manager",
  sales_executive:"Sales executive", operations:"Operations", accounts:"Accounts", marketing:"Marketing",
  supplier_manager:"Supplier manager", read_only:"View only"
};
const TASK_TYPE = { call:"Call", follow_up:"Follow up", payment:"Payment", document:"Document", supplier_confirmation:"Supplier confirmation", visa:"Visa", booking:"Booking", travel:"Travel", other:"Other" };
const PRIORITY = { low:"Low", normal:"Normal", high:"High", urgent:"Urgent" };
const FACTOR = { travel_date:"Travel date is close", budget:"Budget", group_size:"Group size", source:"Where it came from", repeat_customer:"Booked with us before", business:"Agent or company", destination_known:"Destination known", phone_and_email:"Phone and email given" };
const KIND = { individual:"Person", company:"Company", agent:"Travel agent" };
const CHANNEL = { whatsapp:"WhatsApp", email:"Email", sms:"SMS", call:"Phone call" };

const sb = window.supabase && window.supabase.createClient
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}})
  : null;

// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3800); }
function day(iso){
  if(!iso) return "";
  const d = new Date(String(iso).length===10 ? iso+"T00:00:00" : iso);
  if(isNaN(d)) return "";
  const opt = {day:"numeric", month:"short"};
  if(d.getFullYear() !== new Date().getFullYear()) opt.year = "numeric";
  return d.toLocaleDateString("en-IN", opt);
}
function when(iso){
  const d = new Date(iso); if(!iso || isNaN(d)) return "";
  return day(iso) + ", " + d.toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit"});
}
function span(ms){
  const m = Math.round(Math.abs(ms)/60000);
  if(m < 60) return m + " min";
  const h = Math.round(m/60);
  if(h < 48) return h + " h";
  return Math.round(h/24) + " days";
}
function isLive(t){ return t.status==="open" || t.status==="in_progress"; }
function dueText(t){
  if(t.status==="done") return "Done";
  if(t.status==="cancelled") return "Cancelled";
  if(!t.due_at) return "No due date";
  const diff = new Date(t.due_at) - Date.now();
  return diff < 0 ? "Overdue by " + span(diff) : "Due in " + span(diff) + " · " + when(t.due_at);
}
function localInput(d){
  if(!(d instanceof Date)) d = new Date(d);
  if(isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function rupees(n){ return n==null || n==="" ? "" : "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:0}); }
function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}
function pax(l){
  return [l.pax_adults ? l.pax_adults+" adult"+(l.pax_adults===1?"":"s") : "", l.pax_children ? l.pax_children+" child"+(l.pax_children===1?"":"ren") : "", l.pax_infants ? l.pax_infants+" infant"+(l.pax_infants===1?"":"s") : ""].filter(Boolean).join(", ");
}
function stagePill(s){ return `<span class="pill ${STATUS_TONE[s] || ""}">${esc(STATUS[s] || s)}</span>`; }
function tempPill(t, score){ if(!t) return ""; const x = TEMP[t] || [t,""]; return `<span class="pill ${x[1]}">${esc(x[0])}${score!=null ? " · "+esc(score) : ""}</span>`; }
function kv(pairs){ const rows = pairs.filter(p=>p[1]!=null && p[1]!==""); return rows.length ? `<dl class="kv">${rows.map(p=>`<div><dt>${esc(p[0])}</dt><dd>${p[2] ? p[1] : esc(p[1])}</dd></div>`).join("")}</dl>` : `<p class="muted">Nothing recorded yet.</p>`; }
function list(str){ return String(str || "").split(",").map(s=>s.trim()).filter(Boolean); }

// ---------------------------------------------------------------- API
async function token(){
  if(!sb) throw Object.assign(new Error("The sign-in library did not load."),{code:"no_sb"});
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw Object.assign(new Error("Please sign in."),{code:"signed_out"});
  return session.access_token;
}
async function api(action, payload={}){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer "+await token()}, body:JSON.stringify({action, ...payload})});
  let data = null;
  try{ data = await r.json(); }catch(e){}
  if(r.ok && data) return data;
  const code = (data && data.error) || (r.status===401 ? "signed_out" : "server_error");
  throw Object.assign(new Error((data && data.message) || ("The server answered "+r.status+".")), {code, status:r.status});
}
function fail(e){
  if(e && e.code==="signed_out"){ S.me = null; gateSignIn(); return; }
  toast((e && e.message) || "That did not work.");
}

// ---------------------------------------------------------------- state
const S = {
  me:null, boot:null, route:{name:"dashboard", id:""},
  lf:{status:"", temperature:"", owner:"", q:""}, leads:[], leadsTotal:0,
  tf:{when:"open", scope:"mine"}, cq:"",
  lead:null, customer:null, dashTasks:null, tasks:{}
};
let viewSeq = 0;

// ---------------------------------------------------------------- boot
async function boot(){
  if(!sb){ gate("CRM", "The sign-in library did not load. Check your connection and reload."); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ gateSignIn(); return; }
  try{
    S.boot = await api("bootstrap");
    S.me = S.boot.me;
  }catch(e){
    if(e.code==="signed_out"){ gateSignIn(); return; }
    if(e.status===403){ gate("No access yet", e.message); return; }
    gate("Couldn't open the CRM", e.message + " Reload to try again."); return;
  }
  $("#me").innerHTML = `<span>${esc(S.me.name || S.me.email)} · ${esc(ROLE[S.me.role] || S.me.role)}</span><a href="${esc(HQ_URL)}">← HQ</a>`;
  renderShell();
  route();
}
function gate(title, msg){ $("#app").innerHTML = `<div class="gate"><div class="card"><h2>${esc(title)}</h2><p class="muted">${esc(msg)}</p><a class="btn" href="${esc(HQ_URL)}">Open NegoTrip HQ</a></div></div>`; }

function parseRoute(){

function taskRow(t, showLead, noEdit){
  S.tasks[t.id] = t;
  const live = isLive(t), over = live && t.due_at && new Date(t.due_at) < new Date();
  const can = S.me.role !== "read_only";
  const flags = [
    live && (t.priority==="urgent" || t.priority==="high") ? `<span class="pill ${t.priority==="urgent"?"bad":"warn"}">${esc(PRIORITY[t.priority])}</span>` : "",
    live && t.escalated_at ? `<span class="pill bad">Escalated</span>` : ""
  ].join(" ");
  const who = t.owner_name || "No owner";
  const link = showLead && t.lead ? ` · <a href="#/lead/${esc(t.lead.id)}">${esc(t.lead.full_name || t.lead.lead_no)}</a>` : (showLead && t.customer ? ` · <a href="#/customer/${esc(t.customer.id)}">${esc(t.customer.full_name)}</a>` : "");
  return `<li class="task ${live ? "" : "done"}">
    ${can ? `<button class="tick" data-act="${live ? "taskDone" : "taskReopen"}" data-id="${esc(t.id)}" aria-label="${live ? "Mark done" : "Reopen"}: ${esc(t.title)}">${live ? "" : "✓"}</button>` : ""}
    <div class="tbody">
      <div class="ttitle">${esc(t.title)} ${flags}</div>
      <div class="sub ${over ? "over" : ""}">${esc(TASK_TYPE[t.type] || t.type)} · ${esc(dueText(t))}<span class="muted" style="font-weight:400"> · ${esc(who)}${link}</span></div>
      ${t.body ? `<div class="sub">${esc(t.body)}</div>` : ""}
    </div>
    ${can && live && !noEdit ? `<button class="link quiet" data-act="taskEdit" data-id="${esc(t.id)}">Edit</button>` : ""}
  </li>`;
}
function ownerOptions(selected, withNone){
  return (withNone ? `<option value="">No owner</option>` : "") + (S.boot.staff || []).map(s=>`<option value="${esc(s.id)}" ${s.id===selected ? "selected" : ""}>${esc(s.name)}${s.id===S.me.id ? " (me)" : ""}</option>`).join("");
}
function taskForm(t, ctx){
  const editing = !!t;
  const tomorrow = new Date(Date.now() + 864e5); tomorrow.setHours(10, 0, 0, 0);
  const fields = [
    {id:"title", label:"What needs doing", type:"text", value:editing ? t.title : "", wide:true, max:200},
    {id:"type", label:"Kind", type:"select", value:editing ? t.type : "follow_up", options:Object.keys(TASK_TYPE).map(k=>[k, TASK_TYPE[k]])},
    {id:"priority", label:"Priority", type:"select", value:editing ? t.priority : "normal", options:Object.keys(PRIORITY).map(k=>[k, PRIORITY[k]])},
    {id:"due_at", label:"Due", type:"datetime-local", value:editing ? (t.due_at ? localInput(t.due_at) : "") : localInput(tomorrow)}
  ];
  if(S.me.is_manager) fields.push({id:"owner_staff_id", label:"For", type:"select", value:editing ? (t.owner_staff_id || S.me.id) : S.me.id, options:(S.boot.staff || []).map(s=>[s.id, s.name + (s.id===S.me.id ? " (me)" : "")])});
  fields.push({id:"body", label:"Details", type:"textarea", value:editing ? (t.body || "") : "", wide:true, max:2000, optional:true});
  openForm({
    title: editing ? "Edit task" : "Add a task", submit: editing ? "Save task" : "Add task", fields,
    onSubmit: async v=>{
      if(!v.title) throw new Error("Say what needs doing.");
      const due = v.due_at ? new Date(v.due_at).toISOString() : "";
      if(editing){
        const p = {};
        if(v.title !== t.title) p.title = v.title;
        if(v.type !== t.type) p.type = v.type;
        if(v.priority !== t.priority) p.priority = v.priority;
        if(v.body !== (t.body || "")) p.body = v.body;
        if(v.due_at !== (t.due_at ? localInput(t.due_at) : "")) p.due_at = due;
        if(v.owner_staff_id && v.owner_staff_id !== t.owner_staff_id) p.owner_staff_id = v.owner_staff_id;
        if(!Object.keys(p).length) return;
        await api("task_update", {id:t.id, ...p});
      }else{
        const p = { title:v.title, type:v.type, priority:v.priority, body:v.body, due_at:due };
        if(v.owner_staff_id) p.owner_staff_id = v.owner_staff_id;
        await api("task_create", {...p, ...(ctx || {})});
      }
      toast(editing ? "Task saved." : "Task added.");
      refreshBoot(); refresh();
    }
  });
}

function staffEdit(id){
  const s = (S.team || []).find(x=>x.id===id); if(!s) return;
  const init = { role:s.role, active:s.active ? "yes" : "no", specialities:(s.specialities || []).join(", "), languages:(s.languages || []).join(", "), max_open_leads:s.max_open_leads ?? "", phone:s.phone_e164 || "" };
  const fields = [];
  if(!s.is_me){
    fields.push({id:"role", label:"Role", type:"select", value:init.role, options:Object.keys(ROLE).filter(k=>k!=="super_admin" || S.me.role==="super_admin").map(k=>[k, ROLE[k]])});
    fields.push({id:"active", label:"Access", type:"select", value:init.active, options:[["yes","Active"],["no","Paused"]]});
  }
  fields.push(
    {id:"specialities", label:"Good at", type:"text", wide:true, value:init.specialities, hint:"Destinations or kinds of customer, separated by commas. New leads that match go to this person first.", optional:true},
    {id:"languages", label:"Languages", type:"text", value:init.languages, optional:true},
    {id:"max_open_leads", label:"Most open leads at once", type:"number", value:init.max_open_leads, hint:"Leave empty for no limit.", optional:true},
    {id:"phone", label:"Phone", type:"tel", max:30, value:init.phone, optional:true}
  );
  openForm({
    title:s.name, intro:s.email, submit:"Save", fields,
    onSubmit: async v=>{
      const p = {};
      if(v.role !== undefined && v.role !== init.role) p.role = v.role;
      if(v.active !== undefined && v.active !== init.active) p.active = v.active === "yes";
      if(v.specialities !== init.specialities) p.specialities = list(v.specialities);
      if(v.languages !== init.languages) p.languages = list(v.languages);
      if(String(v.max_open_leads) !== String(init.max_open_leads)) p.max_open_leads = v.max_open_leads;
      if(v.phone !== init.phone) p.phone = v.phone;
      if(!Object.keys(p).length) return;
      await api("staff_update", {id:s.id, ...p});
      toast("Saved."); refreshBoot(); refresh();

  });
}

  const lab = `<label for="${id}">${esc(f.label)}${f.optional ? ` <span class="muted" style="font-weight:400">(optional)</span>` : ""}</label>`;
  let input;
  if(f.type==="select") input = `<select id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v) ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if(f.type==="textarea") input = `<textarea id="${id}" ${f.max ? `maxlength="${f.max}"` : ""}>${esc(v)}</textarea>`;
  else input = `<input type="${f.type}" id="${id}" value="${esc(v)}" autocomplete="off" ${f.max ? `maxlength="${f.max}"` : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""} ${f.type==="number" ? `min="0" inputmode="numeric"` : ""}>`;
  return `<div class="field ${f.wide ? "wide" : ""}">${lab}${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
}
function openForm(cfg){
  formCtx = cfg;
  $("#dlgTitle").textContent = cfg.title;
  $("#dlgIntro").textContent = cfg.intro || ""; $("#dlgIntro").hidden = !cfg.intro;
  $("#dlgErr").hidden = true;
  $("#dlgFields").innerHTML = (cfg.fields || []).map(fieldHtml).join("");
  $("#dlgSave").textContent = cfg.submit || "Save"; $("#dlgSave").disabled = false;
  dlg.showModal();
  const first = $("#dlgFields input, #dlgFields select, #dlgFields textarea");
  if(first) first.focus(); else $("#dlgSave").focus();
}
$("#dlgForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  if(!formCtx) return;
  const v = {};
  (formCtx.fields || []).forEach(f=>{ const el = $("#f_" + f.id); if(el) v[f.id] = el.value.trim(); });
  const btn = $("#dlgSave"), label = btn.textContent; btn.disabled = true; btn.textContent = "Saving…";
  try{ await formCtx.onSubmit(v); dlg.close(); }
  catch(e){
    if(e.code==="signed_out"){ dlg.close(); fail(e); return; }
    const el = $("#dlgErr"); el.textContent = e.message || "That did not work."; el.hidden = false;
  }
  finally{ btn.disabled = false; btn.textContent = label; }
});
$("#dlgCancel").addEventListener("click", ()=>dlg.close());
dlg.addEventListener("close", ()=>{ if(formCtx && formCtx.onClose) formCtx.onClose(); formCtx = null; });

// ---------------------------------------------------------------- actions
async function taskOp(id, op, msg){
  try{ await api("task_update", {id, op}); toast(msg); refreshBoot(); refresh(); }catch(e){ fail(e); }
}
const ACT = {
  retry: ()=>refresh(),
  leadAdd: ()=>leadAdd(),
  leadFilter: el=>{ let f = {}; try{ f = JSON.parse(el.dataset.filter || "{}"); }catch(e){} S.lf = {status:f.status || "", temperature:f.temperature || "", owner:f.owner || "", q:""}; if(location.hash==="#/leads") route(); else location.hash = "#/leads"; },
  leadEdit: ()=>leadEdit(),
  leadTake: ()=>leadCall("lead_assign", {staff_id:"me"}, "This lead is yours now."),
  noteAdd: ()=>{ const el = $("#noteBody"), body = el ? el.value.trim() : ""; if(!body){ toast("Write the note first."); if(el) el.focus(); return; } leadCall("lead_note_add", {body}, "Note saved."); },
  dupMerge: el=>{
    const x = S.lead.duplicates.find(d=>d.id===el.dataset.id); if(!x) return;
    openForm({ title:"Merge this lead?", submit:"Merge", fields:[],
      intro:`${S.lead.lead.lead_no} will be closed as a duplicate and ${x.other.lead_no} (${x.other.full_name || "no name"}) stays open. Nothing is deleted, and the history shows the merge.`,
      onSubmit: async ()=>{ const r = await api("duplicate_decide", {id:x.id, decision:"merge"}); toast("Merged."); refreshBoot(); if(r.kept_lead_id) location.hash = "#/lead/" + r.kept_lead_id; else refresh(); } });
  },
  dupDismiss: async el=>{ try{ await api("duplicate_decide", {id:el.dataset.id, decision:"dismiss"}); toast("Marked as not the same person."); refreshBoot(); refresh(); }catch(e){ fail(e); } },
  taskAdd: ()=>taskForm(null, S.route.name==="lead" && S.lead ? {lead_id:S.lead.lead.id} : S.route.name==="customer" && S.customer ? {customer_id:S.customer.customer.id} : null),
  taskEdit: el=>{ const t = S.tasks[el.dataset.id]; if(t) taskForm(t); },
  taskDone: el=>taskOp(el.dataset.id, "complete", "Task done."),
  taskReopen: el=>taskOp(el.dataset.id, "reopen", "Task reopened."),
  taskWhen: el=>{ S.tf.when = el.dataset.v; route(true); },
  taskScope: el=>{ S.tf.scope = el.dataset.v; route(true); },
  custEdit: ()=>custEdit(),
  prefEdit: ()=>prefEdit(),
  travAdd: ()=>travForm(null),
  travEdit: el=>{ const t = S.customer.travellers.find(x=>x.id===el.dataset.id); if(t) travForm(t); },
  travRemove: el=>{
    const t = S.customer.travellers.find(x=>x.id===el.dataset.id); if(!t) return;
    openForm({ title:"Remove this traveller?", submit:"Remove", fields:[], intro:`${t.full_name} will no longer be listed for this customer.`,
      onSubmit: async ()=>{ await api("traveller_save", {id:t.id, remove:true}); toast("Traveller removed."); refresh(); } });
  },
  staffEdit: el=>staffEdit(el.dataset.id)
};
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(el && ACT[el.dataset.act] && S.me){ e.preventDefault(); ACT[el.dataset.act](el); }
});
let qTimer = 0;
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.lf.q = e.target.value.trim(); clearTimeout(qTimer); qTimer = setTimeout(loadLeads, 350); }
  if(e.target.id==="cq"){ S.cq = e.target.value.trim(); clearTimeout(qTimer); qTimer = setTimeout(loadCustomers, 350); }
});
document.addEventListener("change", e=>{
  const id = e.target.id;
  if(id==="fStatus"){ S.lf.status = e.target.value; loadLeads(); }
  else if(id==="fTemp"){ S.lf.temperature = e.target.value; loadLeads(); }
  else if(id==="fOwner"){ S.lf.owner = e.target.value; loadLeads(); }
  else if(id==="leadStage"){
    const to = e.target.value;
    if(to==="lost"){
      openForm({ title:"Why was this lead lost?", submit:"Mark as lost",
        fields:[{id:"reason", label:"Reason", type:"textarea", wide:true, max:500, placeholder:"e.g. Booked elsewhere, price too high, plans changed"}],
        onSubmit: async v=>{ if(!v.reason) throw new Error("Say why the lead was lost."); await api("lead_set_status", {id:S.lead.lead.id, status:"lost", reason:v.reason}); toast("Marked as lost."); refreshBoot(); },
        onClose: ()=>refresh() });
    }else leadCall("lead_set_status", {status:to}, "Stage changed to " + (STATUS[to] || to) + ".");
  }
  else if(id==="leadOwner"){ leadCall("lead_assign", {staff_id:e.target.value || null}, e.target.value ? "Owner changed." : "Owner removed."); }
});

boot();
</script>
